name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace @reliacode/scan-api
      - run: npm exec --workspace reliacode-operations-mvp -- playwright install --with-deps chromium
      - run: npm test --workspace reliacode-operations-mvp
      - name: Verify no bundled business records
        shell: bash
        run: |
          if grep -REn 'RC-(ITM|CTN|PLT)-[0-9]|可靠码示范品牌|华东宠物食品工厂|上海虹桥宠物' apps/scan-web --exclude-dir=tests; then
            echo 'Bundled business data detected'
            exit 1
          fi
      - name: Build static artifact
        shell: bash
        run: |
          mkdir -p dist
          cp apps/scan-web/index.html apps/scan-web/app.js apps/scan-web/runtime-config.js apps/scan-web/*.css apps/scan-web/*.svg dist/
          cp -R apps/scan-web/vendor dist/vendor
          touch dist/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
