name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: reliacode
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: reliacode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reliacode -d reliacode_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:ops
      - run: npm test --workspace @reliacode/scan-api
      - name: Apply migrations twice to PostgreSQL 16
        env:
          NODE_ENV: test
          AUTH_MODE: development
          DATABASE_URL: postgres://reliacode:test-only-password@127.0.0.1:5432/reliacode_test
          SYSTEM_DATABASE_ROLE: reliacode_rls_system_test
          TENANT_DATABASE_ROLE: reliacode_rls_tenant_test
          DATABASE_SSL: "false"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE reliacode_rls_system_test LOGIN NOSUPERUSER NOBYPASSRLS; CREATE ROLE reliacode_rls_tenant_test LOGIN NOSUPERUSER NOBYPASSRLS"
          npm run migrate --workspace @reliacode/scan-api
          npm run migrate --workspace @reliacode/scan-api
          node apps/scan-api/tests/rls.integration.mjs
      - run: npm audit --omit=dev --audit-level=high

  web-browser:
    name: Web browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npm exec --workspace reliacode-operations-mvp -- playwright install --with-deps chromium
      - name: Run isolated browser checks
        run: npm test --workspace reliacode-operations-mvp
