name: reliacode-production

x-api-environment: &api_environment
  NODE_ENV: production
  DEPLOYMENT_ENVIRONMENT: production
  DATABASE_URL_FILE: /run/secrets/database_url
  SYSTEM_DATABASE_URL_FILE: /run/secrets/system_database_url
  TENANT_DATABASE_ROLE: ${TENANT_DATABASE_ROLE:?TENANT_DATABASE_ROLE is required}
  SYSTEM_DATABASE_ROLE: ${SYSTEM_DATABASE_ROLE:?SYSTEM_DATABASE_ROLE is required}
  DATABASE_SSL: "true"
  AUTH_MODE: ${AUTH_MODE:-local}
  ALLOW_PUBLIC_REGISTRATION: "false"
  ENABLE_LEGACY_SYNC_CODE_GENERATION: "false"
  REQUIRE_DEVICE_AUTHORIZATION: "true"
  OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-reliacode-api}
  CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  TRUST_PROXY: "true"
  OPEN_EPCIS_BASE_URL: ${OPEN_EPCIS_BASE_URL:?OPEN_EPCIS_BASE_URL is required}
  OPEN_EPCIS_BEARER_TOKEN_FILE: /run/secrets/openepcis_bearer_token
  GS1_DIGITAL_LINK_BASE_URL: ${GS1_DIGITAL_LINK_BASE_URL:?GS1_DIGITAL_LINK_BASE_URL is required}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-ReliaCode}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
  WEBAUTHN_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
  WEBHOOK_ENCRYPTION_KEY_FILE: /run/secrets/webhook_encryption_key
  SESSION_ROTATION_MINUTES: ${SESSION_ROTATION_MINUTES:-15}
  SESSION_COOKIE_NAME: __Host-reliacode_session
  CSRF_COOKIE_NAME: __Host-reliacode_csrf
  PASSKEY_STEP_UP_MINUTES: ${PASSKEY_STEP_UP_MINUTES:-10}
  SESSION_FINGERPRINT_KEY_FILE: /run/secrets/session_fingerprint_key
  SMTP_URL_FILE: /run/secrets/smtp_url
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
  ACCOUNT_RECOVERY_BASE_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
  OBJECT_STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/object_storage_access_key_id
  OBJECT_STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/object_storage_secret_access_key
  OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-reliacode-api}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:?OTEL_EXPORTER_OTLP_TRACES_ENDPOINT is required}
  OTEL_EXPORTER_OTLP_HEADERS_FILE: /run/secrets/otel_exporter_headers

x-api-secrets: &api_secrets [database_url, system_database_url, openepcis_bearer_token, object_storage_access_key_id, object_storage_secret_access_key, smtp_url, metrics_bearer_token, webhook_encryption_key, session_fingerprint_key, otel_exporter_headers]

x-runtime-hardening: &runtime_hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  migrate:
    <<: *runtime_hardening
    image: ${RELIACODE_API_IMAGE:?RELIACODE_API_IMAGE must be an immutable sha tag}
    command: ["src/migrate.mjs"]
    environment:
      <<: *api_environment
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [database_url, system_database_url, migration_database_url, openepcis_bearer_token, object_storage_access_key_id, object_storage_secret_access_key, smtp_url, metrics_bearer_token, webhook_encryption_key, session_fingerprint_key, otel_exporter_headers]
    restart: "no"

  api:
    <<: *runtime_hardening
    image: ${RELIACODE_API_IMAGE:?RELIACODE_API_IMAGE must be an immutable sha tag}
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
    secrets: *api_secrets
    ports: ["127.0.0.1:4180:4180"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "src/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  outbox-worker:
    <<: *runtime_hardening
    image: ${RELIACODE_API_IMAGE:?RELIACODE_API_IMAGE must be an immutable sha tag}
    command: ["src/outbox-worker.mjs"]
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
    secrets: *api_secrets
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  code-worker:
    <<: *runtime_hardening
    image: ${RELIACODE_API_IMAGE:?RELIACODE_API_IMAGE must be an immutable sha tag}
    command: ["src/code-job-worker.mjs"]
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
    secrets: *api_secrets
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  webhook-worker:
    <<: *runtime_hardening
    image: ${RELIACODE_API_IMAGE:?RELIACODE_API_IMAGE must be an immutable sha tag}
    command: ["src/webhook-worker.mjs"]
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
    secrets: *api_secrets
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  code-export-worker:
    <<: *runtime_hardening
    image: ${RELIACODE_API_IMAGE:?RELIACODE_API_IMAGE must be an immutable sha tag}
    command: ["src/code-export-worker.mjs"]
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
    secrets: *api_secrets
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  reward-reconciliation-worker:
    <<: *runtime_hardening
    image: ${RELIACODE_API_IMAGE:?RELIACODE_API_IMAGE must be an immutable sha tag}
    command: ["src/reward-reconciliation-worker.mjs"]
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
    secrets: *api_secrets
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    <<: *runtime_hardening
    image: ${RELIACODE_WEB_IMAGE:?RELIACODE_WEB_IMAGE must be an immutable sha tag}
    environment:
      NODE_ENV: production
      RELIACODE_API_URL: http://api:4180
      RELIACODE_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
    ports: ["127.0.0.1:${WEB_PORT:-4173}:4173"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:4173/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

secrets:
  database_url:
    file: ./secrets/database_url.txt
  system_database_url:
    file: ./secrets/system_database_url.txt
  migration_database_url:
    file: ./secrets/migration_database_url.txt
  openepcis_bearer_token:
    file: ./secrets/openepcis_bearer_token.txt
  object_storage_access_key_id:
    file: ./secrets/object_storage_access_key_id.txt
  object_storage_secret_access_key:
    file: ./secrets/object_storage_secret_access_key.txt
  smtp_url:
    file: ./secrets/smtp_url.txt
  metrics_bearer_token:
    file: ./secrets/metrics_bearer_token.txt
  webhook_encryption_key:
    file: ./secrets/webhook_encryption_key.txt
  session_fingerprint_key:
    file: ./secrets/session_fingerprint_key.txt
  otel_exporter_headers:
    file: ./secrets/otel_exporter_headers.txt
