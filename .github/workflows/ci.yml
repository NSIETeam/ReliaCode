name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scan-api, scan-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'scan-web'
        run: npx playwright install --with-deps chromium
      - if: matrix.app == 'scan-web'
        run: |
          npm run dev > /tmp/reliacode-web.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:4173/health/live && exit 0; sleep 1; done
          cat /tmp/reliacode-web.log
          exit 1
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
