name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace @reliacode/scan-api
      - run: npm exec --workspace reliacode-operations-mvp -- playwright install --with-deps chromium
      - run: |
          npm run dev --workspace reliacode-operations-mvp > /tmp/reliacode-web.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:4173/health/live && exit 0; sleep 1; done
          cat /tmp/reliacode-web.log
          exit 1
      - run: npm test --workspace reliacode-operations-mvp
      - name: Verify no bundled business records
        shell: bash
        run: |
          if grep -REn 'RC-(ITM|CTN|PLT)-[0-9]|可靠码示范品牌|华东宠物食品工厂|上海虹桥宠物' apps/scan-web --exclude-dir=tests; then
            echo 'Bundled business data detected'
            exit 1
          fi
      - name: Build static artifact
        shell: bash
        run: |
          mkdir -p dist
          cp apps/scan-web/index.html apps/scan-web/app.js apps/scan-web/*.css apps/scan-web/*.svg dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
