name: production-release

on:
  push:
    branches: [main]
    paths:
      - "apps/scan-api/**"
      - "apps/scan-web/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/nsieteam/reliacode-api
  WEB_IMAGE: ghcr.io/nsieteam/reliacode-web

jobs:
  api-image:
    name: Test and publish API image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: reliacode
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: reliacode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reliacode -d reliacode_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace @reliacode/scan-api
      - name: Apply production migrations to PostgreSQL 16
        env:
          NODE_ENV: test
          AUTH_MODE: development
          DATABASE_URL: postgres://reliacode:test-only-password@127.0.0.1:5432/reliacode_test
          DATABASE_SSL: "false"
        run: |
          npm run migrate --workspace @reliacode/scan-api
          npm run migrate --workspace @reliacode/scan-api
      - name: Validate checked-in SQL migrations
        run: |
          test -s apps/scan-api/migrations/012_webhook_delivery_runtime.sql
          node --check apps/scan-api/src/code-job-worker.mjs
      - run: npm audit --workspace @reliacode/scan-api --omit=dev --audit-level=high
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build API image for vulnerability scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/scan-api
          load: true
          push: false
          pull: true
          tags: reliacode-api:scan
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Block fixable high and critical API vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: reliacode-api:scan
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/scan-api
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web-image:
    name: Test and publish Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm exec --workspace reliacode-operations-mvp -- playwright install --with-deps chromium
      - name: Run browser tests
        shell: bash
        run: |
          set -euo pipefail
          npm run dev --workspace reliacode-operations-mvp > "$RUNNER_TEMP/reliacode-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/health/live >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/reliacode-web.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/health/live >/dev/null
          npm test --workspace reliacode-operations-mvp
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/scan-web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy matching images to production
    needs: [api-image, web-image]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure production SSH trust
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/reliacode_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/reliacode_deploy" "$HOME/.ssh/known_hosts"
      - name: Copy deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/reliacode/deploy' }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          case "$DEPLOY_PATH" in /*) ;; *) echo "DEPLOY_PATH must be absolute"; exit 1;; esac
          case "$DEPLOY_PATH" in *[!A-Za-z0-9_./-]*) echo "DEPLOY_PATH contains unsupported characters"; exit 1;; esac
          ssh -i "$HOME/.ssh/reliacode_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "install -d '$DEPLOY_PATH'"
          scp -i "$HOME/.ssh/reliacode_deploy" -P "$DEPLOY_PORT" deploy/compose.production.yaml deploy/release.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -i "$HOME/.ssh/reliacode_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 700 '$DEPLOY_PATH/release.sh'"
      - name: Authenticate server to GHCR
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/reliacode_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
      - name: Migrate, deploy and verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/reliacode/deploy' }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/reliacode_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && RELEASE_SHA='$RELEASE_SHA' ./release.sh"
