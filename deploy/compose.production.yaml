name: reliacode-production

services:
  migrate:
    image: ${RELIACODE_API_IMAGE:-ghcr.io/nsieteam/reliacode-api:latest}
    command: ["src/migrate.mjs"]
    environment: &api_environment
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SSL: ${DATABASE_SSL:-false}
      AUTH_MODE: ${AUTH_MODE:-local}
      ALLOW_PUBLIC_REGISTRATION: "false"
      ENABLE_LEGACY_SYNC_CODE_GENERATION: "false"
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-reliacode-api}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      TRUST_PROXY: "true"
      OPEN_EPCIS_BASE_URL: ${OPEN_EPCIS_BASE_URL:?OPEN_EPCIS_BASE_URL is required}
      GS1_DIGITAL_LINK_BASE_URL: ${GS1_DIGITAL_LINK_BASE_URL:?GS1_DIGITAL_LINK_BASE_URL is required}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-ReliaCode}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
      WEBAUTHN_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY is required}
    secrets: [database_url]
    restart: "no"

  api:
    image: ${RELIACODE_API_IMAGE:-ghcr.io/nsieteam/reliacode-api:latest}
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
    secrets: [database_url]
    ports: ["4180:4180"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "src/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  outbox-worker:
    image: ${RELIACODE_API_IMAGE:-ghcr.io/nsieteam/reliacode-api:latest}
    command: ["src/outbox-worker.mjs"]
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
    secrets: [database_url]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  code-worker:
    image: ${RELIACODE_API_IMAGE:-ghcr.io/nsieteam/reliacode-api:latest}
    command: ["src/code-job-worker.mjs"]
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
    secrets: [database_url]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  webhook-worker:
    image: ${RELIACODE_API_IMAGE:-ghcr.io/nsieteam/reliacode-api:latest}
    command: ["src/webhook-worker.mjs"]
    environment:
      <<: *api_environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
    secrets: [database_url]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    image: ${RELIACODE_WEB_IMAGE:-ghcr.io/nsieteam/reliacode-web:latest}
    environment:
      NODE_ENV: production
      RELIACODE_API_URL: http://api:4180
    ports: ["${WEB_PORT:-4173}:4173"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

secrets:
  database_url:
    file: ./secrets/database_url.txt
